[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "priism-selfcal"
version = "0.1.0"
description = "Self-calibration for ALMA sparse-modeling imaging (Ikeda et al. 2025), standalone from priism"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "priism",
]

[tool.setuptools.packages.find]
include = ["priism_selfcal*"]
